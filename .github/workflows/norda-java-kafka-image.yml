name: Norda Java Kafka image

on:
  pull_request:
    branches:
      - norda-release/**
  push:
    branches:
      - norda-release/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the Kafka all-in-one runner
        run: >-
          mvn --batch-mode --no-transfer-progress clean package
          -DskipTests
          -Pkafka
          -Dkafka
          -Dquarkus.profile=kafka
          -pl AllInOneRunner
          -am

      - name: Derive immutable image tag
        id: image
        shell: bash
        run: echo "tag=6.0.1-norda-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: AllInOneRunner
          file: AllInOneRunner/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/dataduct-networks-inc/scorpio-all-in-one-runner:${{ steps.image.outputs.tag }}

      - name: Report image
        run: echo "ghcr.io/dataduct-networks-inc/scorpio-all-in-one-runner:${{ steps.image.outputs.tag }}"
